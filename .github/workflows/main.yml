name: Generate Plane

on:
  schedule:
    - cron: "0 0 * * *" # atualiza todos os dias
  workflow_dispatch: # permite rodar manualmente
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate plane animation
        run: node scripts/generate-plane.mjs flavslopes dist/plane.svg
        env:
          # Se quiser incluir contribuições privadas, crie um token pessoal
          # (scope read:user) e salve como secret PROFILE_TOKEN.
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Generate project cards
        run: node scripts/generate-cards.mjs flavslopes dist pizzaria-nostra-web se-a-vida-te-der-tangerinas
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push plane animation
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
